{% load static %}
<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>{% block title %}MEDINTEL OSINT{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{% static 'vendor/tabler/tabler.min.css' %}?v=1.4.0"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/medintel.css' %}?v=20260814-8"
    >

    {% block extra_css %}{% endblock %}
</head>

<body>
    <div class="page">
        {% include "includes/sidebar.html" %}

        <div class="page-wrapper">
            {% include "includes/topbar.html" %}

            <div class="page-body">
                <div class="container-xl">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>

    <script
        src="{% static 'vendor/tabler/tabler.min.js' %}?v=1.4.0"
    ></script>

    <script src="{% static 'js/medintel.js' %}?v=20260814-2"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
