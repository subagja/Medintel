{% load static %}
<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Masuk — MEDINTEL OSINT</title>

    <link rel="stylesheet" href="{% static 'vendor/tabler/tabler.min.css' %}?v=1.4.0">
    <link rel="stylesheet" href="{% static 'css/medintel.css' %}?v=20260814-4">
</head>
<body class="border-top-wide border-primary d-flex flex-column">
    <div class="page page-center">
        <div class="container container-tight py-4">
            <div class="text-center mb-4">
                <img
                    class="medintel-login-logo"
                    src="{% static 'img/brand/medintel-login-transparent.png' %}"
                    alt="MedIntel OSINT — Sistem Intelijen Medik Berbasis OSINT"
                >
            </div>

            <form class="card card-md" method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="card-body">
                    <h2 class="h2 text-center mb-4">Masuk ke akun Anda</h2>

                    {% if form.errors %}
                        <div class="alert alert-danger" role="alert">
                            Username atau password salah. Silakan coba lagi.
                        </div>
                    {% endif %}

                    {% if next %}
                        <div class="alert alert-warning" role="alert">
                            Anda perlu login untuk mengakses halaman tersebut.
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            autofocus
                            required
                        >
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Password</label>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >
                    </div>

                    <input type="hidden" name="next" value="{{ next }}">

                    <div class="form-footer">
                        <button type="submit" class="btn btn-primary w-100">Masuk</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
